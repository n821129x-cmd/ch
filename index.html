<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>建材護照示範系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen console — 3D stage on the left, passport panel on the right; stacks on phones */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6fa; --line:#d8dee8;
  --fg:#18233a; --muted:#5d6a80; --stage:#e4e9f0; --stage-grid:#cfd7e2;
  --accent:#2f5597; --accent-ink:#ffffff; --accent-soft:#e2eaf7; --tool:#8fb3bd; --sel:#2563c9; --sel-soft:#dfe9fb;
  --carbon:#2e7d5b; --carbon-soft:#e3f1e8;
  --circ:#0a6fb8; --circ-soft:#dfeefa;
  --maint:#c96d12; --maint-soft:#fcecd9;
  --ok:#2e7d5b; --warn:#c96d12; --none:#8a94a6;
  --shadow:0 1px 2px rgba(20,35,60,.06),0 6px 18px rgba(20,35,60,.06);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#162030; --surface-2:#1b2738; --line:#2a3850;
  --fg:#e6ecf5; --muted:#9aa8bd; --stage:#121b29; --stage-grid:#22314a;
  --accent:#7ea6e8; --accent-ink:#0f1520; --accent-soft:#1f2f4a; --tool:#4b6a74; --sel:#8fb6ff; --sel-soft:#1d2e4d;
  --carbon:#6fcf9f; --carbon-soft:#183326; --circ:#69b6ef; --circ-soft:#15304a;
  --maint:#f0a35a; --maint-soft:#3a2714; --ok:#6fcf9f; --warn:#f0a35a; --none:#7d889b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#162030; --surface-2:#1b2738; --line:#2a3850;
  --fg:#e6ecf5; --muted:#9aa8bd; --stage:#121b29; --stage-grid:#22314a;
  --accent:#7ea6e8; --accent-ink:#0f1520; --accent-soft:#1f2f4a; --tool:#4b6a74; --sel:#8fb6ff; --sel-soft:#1d2e4d;
  --carbon:#6fcf9f; --carbon-soft:#183326; --circ:#69b6ef; --circ-soft:#15304a;
  --maint:#f0a35a; --maint-soft:#3a2714; --ok:#6fcf9f; --warn:#f0a35a; --none:#7d889b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.02em;text-wrap:balance}
.brand .crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--fg);font-weight:500}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.demo-tag{font-size:12px;color:var(--maint);background:var(--maint-soft);padding:3px 10px;border-radius:99px;white-space:nowrap}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:500;color:var(--fg);background:color-mix(in srgb,var(--surface) 82%,transparent);padding:1px 7px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.lbl.hot{background:var(--maint);color:#fff;border-color:transparent;pointer-events:auto;cursor:pointer;font-weight:700}
.lbl.sys{color:var(--accent);font-weight:700}
.tools{position:absolute;right:12px;top:64px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.iconbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--tool);color:#fff;display:grid;place-items:center;padding:0;position:relative}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib .tip{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:var(--fg);color:var(--bg);padding:2px 7px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.ib:hover .tip,.ib:focus-visible .tip{opacity:1}
.tree{position:absolute;left:12px;top:64px;bottom:56px;width:250px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.tree-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.tree-h button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.tree-b{overflow:auto;padding:6px 6px 10px;font-size:13px}
.tree details{margin-left:10px}
.tree summary{cursor:pointer;padding:3px 6px;border-radius:6px;list-style:none;display:flex;gap:6px;align-items:center}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover{background:var(--surface-2)}
.tleaf{display:flex;gap:6px;align-items:center;width:calc(100% - 10px);margin-left:10px;border:0;background:none;text-align:left;padding:3px 6px;border-radius:6px;font-size:13px}
.tleaf:hover{background:var(--surface-2)}
.tleaf.on{background:var(--sel-soft);color:var(--sel);font-weight:700}
.tmat{margin-left:34px;color:var(--muted);font-size:12px;padding:1px 0}
@media (max-width:900px){.tree{width:190px}.tools{top:auto;bottom:56px}.ib{width:34px;height:34px}}
.tools .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .cap{font-size:11px;letter-spacing:.08em;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 8px;border-radius:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:99px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:12px;max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 10px;border-radius:8px}
.panel{min-height:0;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-radius:12px;padding:10px 12px;min-width:0}
.kpi .k{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.kpi .v{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted)}
.kpi.c{background:var(--carbon-soft)} .kpi.c .k,.kpi.c .v{color:var(--carbon)}
.kpi.r{background:var(--circ-soft)} .kpi.r .k,.kpi.r .v{color:var(--circ)}
.kpi.m{background:var(--maint-soft)} .kpi.m .k,.kpi.m .v{color:var(--maint)}
.card{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.card-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.card-b{flex:1;min-height:0;overflow:auto;padding:12px 16px}
.search{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;font:inherit;color:var(--fg)}
.grp{margin:10px 0 4px;font-size:12px;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between}
.item{width:100%;text-align:left;border:0;background:transparent;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.item:hover{background:var(--surface-2)}
.item .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--carbon-soft);color:var(--ok)} .pill.warn{background:var(--maint-soft);color:var(--warn)} .pill.none{background:var(--surface-2);color:var(--none)}
.back{border:0;background:none;color:var(--accent);padding:0;font-size:13px;margin-bottom:6px}
.pp-title{margin:0;font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.3;text-wrap:balance}
.pp-id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tabs button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);padding:6px 0;border-radius:8px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:#fff;border-color:transparent;font-weight:700}
.tabs button[data-t="base"][aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[data-t="carbon"][aria-selected="true"]{background:var(--carbon)}
.tabs button[data-t="circ"][aria-selected="true"]{background:var(--circ)}
.tabs button[data-t="maint"][aria-selected="true"]{background:var(--maint)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0f1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0f1520}}
dl.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbd{color:var(--none)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:12px}
.hist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.hist .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec-h{font-size:13px;font-weight:700;margin:14px 0 4px}
.card-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--maint);color:#fff;flex:1}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line)}
.route{border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
.route.ok{background:var(--carbon-soft)} .route.warn{background:var(--maint-soft)} .route.none{background:var(--surface-2)}
.modal{position:fixed;inset:0;background:rgba(10,16,28,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--surface);color:var(--fg);border-radius:14px;max-width:460px;width:100%;max-height:90%;overflow:auto;padding:18px 20px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.sheet textarea,.sheet input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;font:inherit;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .stage{height:62vh;min-height:360px}
  .card{max-height:none}
  .kpi .v{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>建材護照示範系統</h1>
      <div class="crumb" id="crumb"><b>示範建案</b></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="檢視層級">
      <button id="v-bldg" aria-pressed="true">整棟（建築層級）</button>
      <button id="v-unit" aria-pressed="false">示範戶（住戶層級）</button>
    </div>
    <span class="demo-tag">示範系統｜格局與資料為示意</span>
  </header>

  <div class="main">
    <section class="stage" aria-label="3D 模型">
      <canvas id="cv"></canvas>
      <div class="labels" id="labels"></div>
      <div class="iconbar" role="toolbar" aria-label="檢視工具">
        <button class="ib" id="ib-orbit" aria-pressed="true" aria-label="旋轉"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="4"/><path d="M12 3v18"/><path d="M17 5l3 3-3 3" /></svg><span class="tip">旋轉</span></button>
        <button class="ib" id="ib-pan" aria-pressed="false" aria-label="平移"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="tip">平移</span></button>
        <button class="ib" id="ib-fit" aria-label="全景"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3"/></svg><span class="tip">全景</span></button>
        <button class="ib" id="ib-cut" aria-pressed="false" aria-label="剖切至示範樓層"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 8v8l8 4 8-4V8"/><path d="M2 13h20" stroke-dasharray="2 2"/></svg><span class="tip">剖切至示範樓層</span></button>
        <button class="ib" id="ib-tree" aria-pressed="true" aria-label="模型瀏覽器"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg><span class="tip">模型瀏覽器</span></button>
        <button class="ib" id="ib-prop" aria-label="屬性"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span class="tip">屬性</span></button>
        <button class="ib" id="ib-find" aria-label="搜尋元件"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="tip">搜尋元件</span></button>
      </div>
      <div class="tree" id="tree"><div class="tree-h"><span>模型瀏覽器</span><button id="tree-x" aria-label="關閉模型瀏覽器">×</button></div><div class="tree-b" id="tree-b"></div></div>
      <div class="tools">
        <div class="row"><span class="cap">著色</span>
          <div class="seg" role="group" aria-label="著色方式">
            <button data-color="mat" aria-pressed="true">材質</button>
            <button data-color="layer" aria-pressed="false">建築層次</button>
            <button data-color="warr" aria-pressed="false">保固狀態</button>
          </div>
        </div>
        <div class="row">
          <button class="chip" id="t-sys" aria-pressed="true">消防電氣點位</button>
          <button class="chip" id="t-lbl" aria-pressed="true">標籤</button>
          <button class="chip" id="t-reset">重設視角</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint" id="hint">拖曳旋轉 · 滾輪縮放 · 點選構件看護照</div>
    </section>

    <aside class="panel">
      <div class="kpis" id="kpis"></div>
      <div class="card" id="card"></div>
    </aside>
  </div>
</div>

<div class="modal" id="modal">
  <form class="sheet" id="rform">
    <h3>報修此設備</h3>
    <div class="pp-id" id="r-id"></div>
    <div id="r-info"></div>
    <label for="r-desc">問題描述</label>
    <textarea id="r-desc" rows="3" required placeholder="例：馬桶水箱持續漏水"></textarea>
    <label for="r-who">聯絡人／電話</label>
    <input id="r-who" placeholder="例：王先生 09xx-xxx-xxx">
    <div class="note">示範系統：送出後只記錄在此頁面，不會真的派工。正式版將寫入一站式修繕系統，並於完工驗收時回寫本設備護照。</div>
    <div class="card-f" style="padding:12px 0 0;border:0">
      <button type="button" class="btn ghost" id="r-cancel">取消</button>
      <button type="submit" class="btn primary">建立報修單</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
/* ================= 資料 ================= */
const LAYERS = {
  '物品':{y:'5–15 年',c:'#4ec5c8'}, '空間配置':{y:'5–30 年',c:'#e03b3b'}, '設備系統':{y:'5–30 年',c:'#e08a2c'},
  '外殼':{y:'30–60 年',c:'#6cbf68'}, '結構':{y:'60–200 年',c:'#2f4fd0'}, '基地':{y:'永久',c:'#3a3a3a'}
};
const INSTALL = '2018-12';           // 示範：以使照年估列
const NOW = new Date();
// 保固年限示範：依預售屋買賣定型化契約應記載事項（結構 15 年；固定建材及設備 1 年）估列
function warrantyYears(layer){ return (layer==='結構'||layer==='基地')?15:1; }
function warrantyEnd(it){ if(it.noWarranty) return null; const [y,m]=INSTALL.split('-').map(Number); return new Date(y+warrantyYears(it.layer), m-1, 1); }
function warrState(it){ const e=warrantyEnd(it); if(!e) return 'none'; return e>=NOW?'ok':'warn'; }
const WTXT={ok:'保固內',warn:'已過保',none:'無保固資料'};
const DRY=['螺栓／扣件（乾式）','卡扣／嵌合（乾式）'];

const T='待補';

const M = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.75, metalness:.05}, o));
function box(w,h,d,mat,x,y,z,g){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); (g||unitG).add(m); return m; }
function reg(mesh,id,base){ mesh.userData.id=id; pickables.push(mesh); colorables.push({mesh,id,base:base||mesh.material.color.getHex()}); }
function addLabel(text, pos, group, cls){ const el=document.createElement('div'); el.className='lbl'+(cls?' '+cls:''); el.textContent=text; document.getElementById('labels').appendChild(el); const L={el,pos,group}; labels.push(L); return L; }

function texDots(bg, fg, n){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); x.fillStyle=bg; x.fillRect(0,0,128,128); x.fillStyle=fg; const s=128/n; for(let i=0;i<n;i++)for(let j=0;j<n;j++){x.beginPath(); x.arc(i*s+s/2,j*s+s/2,s*.28,0,7); x.fill();} const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
function texLattice(bg, fg){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); x.fillStyle=bg; x.fillRect(0,0,128,128); x.strokeStyle=fg; x.lineWidth=7; for(let k=-128;k<256;k+=32){x.beginPath();x.moveTo(k,0);x.lineTo(k+128,128);x.stroke();x.beginPath();x.moveTo(k+128,0);x.lineTo(k,128);x.stroke();} const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }

const FLOORS=29, FH=3.2, TW=26, TD=16;
function tower(cx, name, isA){
  const H=FLOORS*FH;
  const core=box(TW-2,H,TD-2,M(0x2a2f37,{roughness:.5,metalness:.2}),cx,H/2,0,bldgG); reg(core,'SK-AL');
  const tA=texDots('#3b414c','#7f8894',6); tA.repeat.set(12,1);
  const bandMat=M(0xffffff,{map:tA,metalness:.3,roughness:.55});
  for(let f=1; f<FLOORS; f++){
    const y=f*FH+.55;
    [[TW,TD/2+.4,0],[TW,-(TD/2+.4),0]].forEach(([w,z])=>{ const b=box(w,1.1,.25,bandMat,cx,y,z,bldgG); reg(b,'SK-AL',0xffffff); });
    [[TW/2+.4],[-(TW/2+.4)]].forEach(([x])=>{ const b=box(.25,1.1,TD,bandMat,cx+x,y,0,bldgG); reg(b,'SK-AL',0xffffff); });
    // V 形白色三角圖案（示意）
    const k=(f%8); const off=(k<4?k:8-k)*2.2;
    [-1,1].forEach(s=>{ const w=box(2.2,1.12,.27,M(0xeeeeec),cx+s*(1.5+off),y,TD/2+.42,bldgG); reg(w,'SK-AL',0xeeeeec); });
  }
  // 白色框架
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{ const c=box(1.6,H+3,1.6,M(0xf3f3f1),cx+sx*(TW/2+.2),(H+3)/2,sz*(TD/2+.2),bldgG); reg(c,'SK-FR',0xf3f3f1); });
  [[TW+2,0,TD/2+.2],[TW+2,0,-(TD/2+.2)]].forEach(([w,,z])=>{ const c=box(w,1.4,1.2,M(0xf3f3f1),cx,H+2.3,z,bldgG); reg(c,'SK-FR',0xf3f3f1); });
  // 結構 B1F–5F 鋼骨（半透明示意）
  const st=box(TW-1.5,6*FH,TD-1.5,M(0x2f4fd0,{transparent:true,opacity:.35}),cx,(5*FH-FH)/2,0,bldgG); reg(st,'ST-SS',0x2f4fd0);
  addLabel(name, new THREE.Vector3(cx,H+8,0), 'bldg');
  return H;
}

const WCOL={ok:0x2e9d6b,warn:0xe0892c,none:0x9aa3b2};
function applyColors(){
  colorables.forEach(({mesh,id,base})=>{
    const it=BYID[id]; let c=base;
    if(S.color==='layer') c=new THREE.Color(LAYERS[it.layer].c).getHex();
    else if(S.color==='warr') c=WCOL[warrState(it)];
    mesh.material.color.setHex(c);
    if(mesh.material.map) mesh.material.map.needsUpdate=false;
    const on = S.sel===id;
    mesh.material.emissive && mesh.material.emissive.setHex(on?0x1f4fbf:(S.hover===id?0x2a2a2a:0x000000));
  });
  // texture maps tint with color — remove map when not material mode
  colorables.forEach(({mesh})=>{ if(mesh.userData._map===undefined) mesh.userData._map=mesh.material.map||null; mesh.material.map = S.color==='mat'? mesh.userData._map : null; mesh.material.needsUpdate=true; });
  renderLegend();
}
function renderLegend(){
  const el=document.getElementById('legend'); let h='';
  if(S.color==='layer'){ const used=new Set(ALL.filter(i=>i.view===S.view).map(i=>i.layer)); h=Object.entries(LAYERS).filter(([k])=>used.has(k)).map(([k,v])=>`<span><i class="dot" style="background:${v.c}"></i>${k} ${v.y}</span>`).join(''); }
  else if(S.color==='warr'){ h=['ok','warn','none'].map(k=>`<span><i class="dot" style="background:#${WCOL[k].toString(16)}"></i>${WTXT[k]}</span>`).join('')+'<span style="color:var(--muted)">保固以「結構 15 年、設備 1 年」示範估列</span>'; }
  else { h='<span><i class="dot" style="background:#2563c9"></i>已選取</span><span style="color:var(--muted)">點選構件或右側清單查看建材護照</span>'; }
  el.innerHTML=h;
}

     <div class="sec-h">維修履歷</div>${it.hist.length?`<ul class="hist">${[...it.hist].reverse().map(h=>`<li><div class="d">${esc(h.d)}｜${esc(h.t)}${h.no?'｜'+esc(h.no):''}</div>${esc(h.x)}</li>`).join('')}</ul>`:'<div class="note">尚無紀錄。報修完工驗收後會自動回寫到這裡。</div>'}`;
  }
  card.innerHTML=`<div class="card-h"><button class="back" id="bk">← 設備清單</button>
     <h2 class="pp-title">${esc(it.name)}</h2><div class="pp-id">${esc(it.pid)}</div>
     <div class="tags"><span class="tag" style="border-color:${ly.c}">${esc(it.layer)}｜${ly.y}</span><span class="tag">${esc(it.space)}</span><span class="pill ${ws}">${WTXT[ws]}</span></div>
     <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" data-t="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('')}</div></div>
   <div class="card-b">${body}</div>
   <div class="card-f"><button class="btn primary" id="rep">報修此設備</button></div>`;
  card.querySelector('#bk').onclick=()=>select(null);
  card.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t; renderCard();});
  card.querySelector('#rep').onclick=()=>openRepair(it);
}
function renderList(card){
  const L=items().filter(i=>!S.q || (i.name+i.space+i.layer).includes(S.q));
  const groups={}; L.forEach(i=>{(groups[i.space]=groups[i.space]||[]).push(i);});
  const intro = S.view==='unit' ? '四房戶型（示範戶）｜戶 → 空間 → 設備' : '整棟｜結構、外殼、基地';
  card.innerHTML=`<div class="card-h"><h2 class="pp-title" style="font-size:17px">建材護照清單</h2><div class="pp-id" style="font-family:var(--f-body)">${intro}</div>
     <input class="search" id="q" placeholder="搜尋設備、空間或層次" value="${esc(S.q==null?'':S.q).replace('—','')}" style="margin-top:10px"></div>
   <div class="card-b">${Object.entries(groups).map(([sp,arr])=>`<div class="grp"><span>${esc(sp)}</span><span>${arr.length} 項</span></div>`+arr.map(i=>`<button class="item" data-id="${i.id}"><i class="dot" style="background:${LAYERS[i.layer].c}"></i><span class="n">${esc(i.name)}</span><span class="pill ${warrState(i)}">${WTXT[warrState(i)]}</span></button>`).join('')).join('') || '<div class="note">找不到符合的設備。</div>'}
   ${S.view==='bldg'?'<div class="note">點選 A 棟橘色樓層，或上方「示範戶」按鈕，進入住戶層級。</div>':''}</div>`;
  const q=card.querySelector('#q'); q.oninput=()=>{ S.q=q.value.trim(); const pos=q.selectionStart; renderList(card); const nq=document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
  card.querySelectorAll('.item').forEach(b=>b.onclick=()=>select(b.dataset.id,true));
}
function renderTree(){
  const el=document.getElementById('tree-b'); const L=items();
  const by={}; L.forEach(i=>{(by[i.space]=by[i.space]||[]).push(i);});
  const root = S.view==='unit' ? '示範建案 › A 棟 › ○F 示範戶' : '示範建案（整棟）';
  el.innerHTML=`<details open><summary>${esc(root)}</summary>${Object.entries(by).map(([sp,arr])=>`<details ${arr.some(i=>i.id===S.sel)?'open':''}><summary>${esc(sp)} <span style="color:var(--muted);font-size:11px">${arr.length}</span></summary>${arr.map(i=>`<button class="tleaf ${S.sel===i.id?'on':''}" data-id="${i.id}"><i class="dot" style="background:${LAYERS[i.layer].c}"></i>${esc(i.name)}</button>${S.sel===i.id?ALL_PARTS(i).map(p=>`<div class="tmat">└ ${esc(p)}</div>`).join(''):''}`).join('')}</details>`).join('')}</details>`;
  el.querySelectorAll('.tleaf').forEach(b=>b.onclick=()=>select(b.dataset.id,true));
}
function select(id, fly){
  S.sel=id; if(id && S.tab==='base' && false) S.tab='base';
  applyColors(); renderCard(); renderTree();
  if(id && fly && S.view==='unit'){ const it=BYID[id]; const t=new THREE.Vector3(OX+it.p[0],.5,OZ+it.p[2]); flyTo(t, 20); }
}
function flyTo(target, dist){
  const dir=camera.position.clone().sub(controls.target).normalize();
  const endT=target.clone(), endP=target.clone().add(dir.multiplyScalar(dist));
  const sT=controls.target.clone(), sP=camera.position.clone(); const t0=performance.now(), dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:600;
  (function step(){ const k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3); controls.target.lerpVectors(sT,endT,e); camera.position.lerpVectors(sP,endP,e); if(k<1) requestAnimationFrame(step); })();
}

/* ================= 報修 ================= */
const modal=document.getElementById('modal'); let repIt=null; let seq=12;
function openRepair(it){
  repIt=it; const ws=warrState(it);
  document.getElementById('r-id').textContent=it.pid+'｜'+it.loc;
  document.getElementById('r-info').innerHTML=`<div class="route ${ws}"><b>${esc(it.name)}</b><br>型號：${V(it.model)}　廠商：${V(it.vendor)}<br>派工建議：${ws==='ok'?'保固內，直接派保固責任廠商':ws==='warn'?'已過保，安排現勘與報價':'無保固資料，客服確認後派工'}</div>`;
  document.getElementById('r-desc').value=''; modal.classList.add('open'); setTimeout(()=>document.getElementById('r-desc').focus(),0);
}
document.getElementById('r-cancel').onclick=()=>{modal.classList.remove('open');};
modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') modal.classList.remove('open'); });
document.getElementById('rform').addEventListener('submit',e=>{
  e.preventDefault(); const d=new Date(); const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const no=`R${d.getFullYear()-1911}-${String(++seq).padStart(4,'0')}`;
  repIt.hist.push({d:ds,t:'報修',no,x:document.getElementById('r-desc').value+'（示範：已立案，待派工）'});
  modal.classList.remove('open'); S.tab='maint'; renderCard(); toast(`已建立示範報修單 ${no}，並記入此設備的維修履歷`);
});
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true; t.style.display='none';},3200); }

/* ================= 互動 ================= */
const ray=new THREE.Raycaster(), mv=new THREE.Vector2(); let down=null;
function pick(ev){
  const r=canvas.getBoundingClientRect(); mv.x=((ev.clientX-r.left)/r.width)*2-1; mv.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mv,camera);
  const list=pickables.filter(m=>{ let o=m; while(o){ if(!o.visible) return false; o=o.parent; } return true; });
  const hit=ray.intersectObjects(list,false)[0]; return hit?hit.object:null;
}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>5) return;
  const o=pick(e); if(!o){ return; }
  if(o.userData.action==='enterUnit'){ setView('unit'); return; }
  if(o.userData.id){ S.tab=S.sel===o.userData.id?S.tab:'base'; select(o.userData.id,false); return; }
  if(o.userData.room){ S.sel=null; S.q=o.userData.room; applyColors(); renderCard(); }
});
canvas.addEventListener('pointermove',e=>{
  if(down) return; const o=pick(e); const id=o&&o.userData.id||null;
  canvas.style.cursor = o&&(o.userData.id||o.userData.action||o.userData.room)?'pointer':'grab';
  if(id!==S.hover){ S.hover=id; applyColors(); }
});

function setView(v){
  S.view=v; S.sel=null; S.q=''; S.tab='base';
  unitG.visible = v==='unit'; bldgG.visible = v==='bldg';
  document.getElementById('v-unit').setAttribute('aria-pressed', v==='unit');
  document.getElementById('v-bldg').setAttribute('aria-pressed', v==='bldg');
  document.getElementById('crumb').innerHTML = v==='unit' ? '示範建案 › A 棟 ○F › <b>四房示範戶</b>' : '<b>示範建案</b>（A、B 棟示意）';
  document.getElementById('t-sys').hidden = v!=='unit';
  setCut(false); document.getElementById('ib-cut').disabled = v!=='bldg';
  resetCam(); applyColors(); renderKPIs(); renderCard(); renderTree();
}
document.getElementById('v-unit').onclick=()=>setView('unit');
document.getElementById('v-bldg').onclick=()=>setView('bldg');
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{ S.color=b.dataset.color; document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x===b)); applyColors(); });
document.getElementById('t-sys').onclick=e=>{ S.sys=!S.sys; e.currentTarget.setAttribute('aria-pressed',S.sys); sysMeshes.forEach(m=>m.visible=S.sys); };
document.getElementById('t-lbl').onclick=e=>{ S.lbl=!S.lbl; e.currentTarget.setAttribute('aria-pressed',S.lbl); };
document.getElementById('t-reset').onclick=resetCam;
document.getElementById('ib-fit').onclick=resetCam;
function setNav(pan){ controls.mouseButtons.LEFT = pan?THREE.MOUSE.PAN:THREE.MOUSE.ROTATE; document.getElementById('ib-pan').setAttribute('aria-pressed',pan); document.getElementById('ib-orbit').setAttribute('aria-pressed',!pan); document.getElementById('hint').textContent = (pan?'拖曳平移':'拖曳旋轉')+' · 滾輪縮放 · 點選構件看護照'; }
document.getElementById('ib-orbit').onclick=()=>setNav(false);
document.getElementById('ib-pan').onclick=()=>setNav(true);
document.getElementById('ib-cut').onclick=()=>{ setCut(!S.cut); if(S.cut){ flyTo(new THREE.Vector3(-17,demoF*FH,0), 110); } };
function setTree(on){ document.getElementById('tree').hidden=!on; document.getElementById('ib-tree').setAttribute('aria-pressed',on); }
document.getElementById('ib-tree').onclick=()=>setTree(document.getElementById('tree').hidden);
document.getElementById('tree-x').onclick=()=>setTree(false);
document.getElementById('ib-prop').onclick=()=>{ const id=S.sel || items()[0].id; S.tab='base'; select(id,false); };
document.getElementById('ib-find').onclick=()=>{ if(S.sel) select(null); setTimeout(()=>{ const q=document.getElementById('q'); if(q) q.focus(); },0); };

/* ================= 渲染迴圈 ================= */
function applyTheme(){ scene.background=new THREE.Color(css('--stage')); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){ const r=canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas.parentElement);
const v3=new THREE.Vector3();
function loop(){
  controls.update(); renderer.render(scene,camera);
  const r=canvas.getBoundingClientRect();
  labels.forEach(L=>{ const show=S.lbl && L.group===S.view; if(!show){ L.el.hidden=true; return; }
    v3.copy(L.pos).project(camera); const vis=v3.z<1 && Math.abs(v3.x)<1.1 && Math.abs(v3.y)<1.1; L.el.hidden=!vis;
    if(vis){ L.el.style.left=((v3.x+1)/2*r.width)+'px'; L.el.style.top=((1-v3.y)/2*r.height)+'px'; } });
  requestAnimationFrame(loop);
}
applyTheme(); resize(); setView('bldg'); loop();
})();
</script>
